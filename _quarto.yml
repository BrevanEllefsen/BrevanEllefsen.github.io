project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - research.qmd
    - talks.qmd
    - cv.qmd
  resources:
    - files/
    - images/

website:
  title: "Brevan Ellefsen"
  description: "Brevan Ellefsen is a mathematics PhD candidate at the University of Illinois Urbana-Champaign, studying essential surfaces, laminations, and foliations in 3-manifolds."
  site-url: "https://brevanellefsen.github.io"

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: talks.qmd
        text: Talks
      - href: cv.qmd
        text: CV

  search: true

format:
  html:
    anchor-sections: false
    theme:
      dark: darkly
      light: flatly
    respect-user-color-scheme: false
    css: styles.css
    toc: true
    toc-depth: 2
    fontsize: 0.92rem
    linestretch: 1.45
    grid:
      body-width: 1100px
      margin-width: 250px
      gutter-width: 1.5rem
